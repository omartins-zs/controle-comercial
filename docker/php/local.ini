; Ajustes de runtime do PHP para o container "app".
; A imagem base php:7.4-apache não carrega NENHUM php.ini por padrão
; (confirmado: `php --ini` mostra "Loaded Configuration File: (none)"), então
; sem este arquivo o PHP roda inteiramente com os defaults compilados —
; inclusive memory_limit/realpath_cache em valores conservadores demais para
; uma app CodeIgniter (muitos arquivos por request).

; --- Limites de execução ---
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M

; --- Timezone ---
; Evita warnings de timezone não definido e datas erradas em relatórios.
date.timezone = America/Sao_Paulo

; --- Realpath cache ---
; CI3 resolve o caminho real de dezenas de arquivos por request
; (core, libraries, helpers, models, views). O default (4096K / 120s) força
; o processo Apache a reconsultar o filesystem com frequência mesmo quando
; nada mudou. Como o código não é bind-mounted (ver opcache.ini), é seguro
; manter esse cache "morno" por mais tempo.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Erros ---
; display_errors/error_reporting continuam sendo decididos em runtime pelo
; próprio index.php do CodeIgniter com base em ENVIRONMENT (development vs
; production) — os valores abaixo são só o fallback inicial antes disso.
log_errors = On
error_log = /var/www/html/application/logs/php_errors.log
