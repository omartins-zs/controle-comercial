; OPcache — a imagem base php:7.4-apache NÃO vem com essa extensão habilitada
; (confirmado: `php -m` não lista opcache). Sem isso, todo request no CI3
; recompila ~30-60 arquivos PHP (system/core, libraries, helpers, models,
; views) do zero. Esse é o maior gargalo de CPU identificado no ambiente.
[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.max_wasted_percentage=10
opcache.fast_shutdown=1

; validate_timestamps=0 é seguro aqui porque o código da aplicação é copiado
; para dentro da imagem no build (COPY no Dockerfile) — não há bind mount do
; código-fonte, então um arquivo PHP só muda dentro do container através de
; `docker compose up -d --build`, que sempre cria um container novo (cache do
; opcache começa vazio). Ou seja: não existe cenário de "editei o arquivo e o
; opcache serviu a versão antiga", porque editar sem rebuild não tem efeito
; nenhum de qualquer forma.
;
; ATENÇÃO: se você adicionar um bind mount do código-fonte para live-edit
; (ex.: `- .:/var/www/html`), troque para opcache.validate_timestamps=1 e
; defina opcache.revalidate_freq=0, ou os arquivos editados no host vão
; parecer "não aplicados" até reiniciar o container.
opcache.validate_timestamps=0
