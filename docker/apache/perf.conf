# Ajuste do MPM prefork (mod_php não usa PHP-FPM, então os equivalentes de
# pm.max_children / pm.start_servers / pm.max_requests do PHP-FPM são estes
# aqui: StartServers / MaxRequestWorkers / MaxConnectionsPerChild do Apache).
#
# O default da imagem (StartServers 5, MaxRequestWorkers 150) foi desenhado
# para servir muito tráfego concorrente — overkill para um único
# desenvolvedor local, e cada processo prefork carrega o interpretador PHP
# inteiro na memória. Reduzimos o teto para economizar RAM do Docker Desktop
# sem limitar a concorrência real que uma sessão de dev/teste gera.
<IfModule mpm_prefork_module>
	StartServers             2
	MinSpareServers          2
	MaxSpareServers          6
	MaxRequestWorkers        30
	MaxConnectionsPerChild   1000
</IfModule>

# Keep-Alive: reduz o overhead de abrir uma conexão TCP nova para cada
# asset (css/js/imagens) que o navegador busca ao trocar de tela.
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
