services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle_comercial_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-blog_comercial}
      DB_USERNAME: ${MYSQL_USER:-blog_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-blog_pass}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8090/}
      CI_ENV: ${CI_ENV:-development}
      # Sessão em arquivo (dentro do container, não bind-mounted) em vez de
      # 'database': evita 1 SELECT + 1 UPDATE/INSERT no MySQL por request só
      # para ler/gravar a sessão. Ver application/config/config.php.
      SESSION_DRIVER: ${SESSION_DRIVER:-files}
      SESSION_SAVE_PATH: ${SESSION_SAVE_PATH:-/var/lib/ci-sessions}
    volumes:
      - ./application/logs:/var/www/html/application/logs
      - ./application/cache:/var/www/html/application/cache
    tmpfs:
      # Sessões em tmpfs: são efêmeras por natureza (perdê-las num restart do
      # container é aceitável em dev/teste local) e tmpfs é RAM pura, então
      # não paga o custo de I/O de disco nem o overhead de bind mount do
      # Windows — mais rápido que gravar em disco do container.
      - /var/lib/ci-sessions:uid=33,gid=33
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - controle_comercial

  db:
    image: mysql:8.0
    container_name: controle_comercial_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_comercial}
      MYSQL_USER: ${MYSQL_USER:-blog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog_pass}
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - controle_comercial

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: controle_comercial_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${PMA_PORT:-8091}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - controle_comercial

volumes:
  db_data:

networks:
  controle_comercial:
    driver: bridge
